<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DHI Bot · Anfragen</title>
<!-- Bewusst ohne externe Skripte, Schriften oder CDNs: Die Seite lädt nichts
     von Dritten, die Daten verlassen den Bot-Server nicht. -->
<style>
  :root { --navy: #1d3557; --blau: #1d6fb5; --grau: #8a94a0; --linie: #e3e7ec; --bg: #f4f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         color: #1f2933; background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: 14px 16px; display: flex;
           align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .karte { background: #fff; border: 1px solid var(--linie); border-radius: 10px; padding: 14px 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi b { display: block; font-size: 26px; color: var(--navy); }
  .kpi span { color: var(--grau); font-size: 12px; }
  .raster { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 900px) { .raster { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--grau); margin: 0 0 10px; }
  .tage { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .tage div { flex: 1; background: var(--blau); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .tage div:hover { background: var(--navy); }
  .achse { display: flex; justify-content: space-between; color: var(--grau); font-size: 11px; margin-top: 4px; }
  .balken { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
  .balken .n { color: var(--grau); font-variant-numeric: tabular-nums; }
  .balken .bar { grid-column: 1 / -1; height: 5px; background: var(--linie); border-radius: 3px; margin-bottom: 6px; }
  .balken .bar i { display: block; height: 100%; background: var(--blau); border-radius: 3px; }
  .leiste { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  input, select, button { font: inherit; padding: 7px 10px; border: 1px solid #b9c4d0; border-radius: 7px; background: #fff; }
  button { cursor: pointer; background: var(--navy); color: #fff; border-color: var(--navy); }
  button.leise { background: #fff; color: var(--navy); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blau); outline-offset: 1px; }
  #suche { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--linie); }
  th { font-size: 12px; color: var(--grau); font-weight: 600; border-top: 0; }
  td.zeit { white-space: nowrap; color: var(--grau); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #e8eef5; color: var(--navy); white-space: nowrap; }
  .tag.fehler { background: #fde8e8; color: #9b1c1c; }
  details summary { cursor: pointer; color: var(--blau); font-size: 12px; }
  details p { white-space: pre-wrap; margin: 6px 0 0; color: #3e4c59; }
  .gid { font: 11px ui-monospace, monospace; color: var(--blau); background: none; border: 0; padding: 0; text-decoration: underline; }
  .x { background: none; border: 0; color: var(--grau); padding: 2px 6px; }
  .x:hover { color: #9b1c1c; }
  .hinweis { font-size: 12px; color: var(--grau); margin-top: 12px; }
  #login { max-width: 380px; margin: 60px auto; }
  #login input { width: 100%; margin: 8px 0; }
  .fehlermeldung { color: #9b1c1c; min-height: 1.4em; }
  .tabelle { overflow-x: auto; }
  @media (max-width: 640px) { td.antw, th.antw { display: none; } }
</style>
</head>
<body>
<header>
  <h1>DHI Bot · Anfragen-Dashboard</h1>
  <button class="leise" id="abmelden" hidden>Abmelden</button>
</header>

<div id="login" class="karte">
  <h2>Anmelden</h2>
  <form id="loginform">
    <label for="token">Dashboard-Token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit">Anzeigen</button>
    <p class="fehlermeldung" id="loginfehler" role="alert"></p>
  </form>
</div>

<main id="app" hidden>
  <section class="kpis" aria-label="Kennzahlen">
    <div class="karte kpi"><b id="k-gesamt">–</b><span>Fragen</span></div>
    <div class="karte kpi"><b id="k-gespraeche">–</b><span>Gespräche</span></div>
    <div class="karte kpi"><b id="k-schnitt">–</b><span>Fragen pro Gespräch</span></div>
    <div class="karte kpi"><b id="k-fehler">–</b><span>Fehler</span></div>
  </section>

  <section class="raster">
    <div class="karte"><h2>Fragen pro Tag</h2><div class="tage" id="tage"></div><div class="achse" id="achse"></div></div>
    <div class="karte"><h2>Themen</h2><div class="balken" id="themen"></div></div>
    <div class="karte"><h2>Seiten</h2><div class="balken" id="seiten"></div></div>
  </section>

  <section class="karte">
    <div class="leiste">
      <select id="zeitraum" aria-label="Zeitraum">
        <option value="7">Letzte 7 Tage</option>
        <option value="30" selected>Letzte 30 Tage</option>
        <option value="90">Letzte 90 Tage</option>
      </select>
      <input id="suche" type="search" placeholder="In Fragen und Antworten suchen …" aria-label="Suche">
      <button class="leise" id="filterweg" hidden>Gesprächsfilter aufheben</button>
      <button class="leise" id="csv">CSV-Export</button>
    </div>
    <div class="tabelle">
      <table>
        <thead><tr><th>Zeit</th><th>Gespräch</th><th>Thema</th><th>Frage</th><th class="antw">Antwort</th><th><span hidden>Löschen</span></th></tr></thead>
        <tbody id="zeilen"></tbody>
      </table>
    </div>
    <p class="hinweis" id="hinweis"></p>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Token nur für diesen Tab (sessionStorage) — weg, sobald der Tab zu ist.
  const store = { get: () => { try { return sessionStorage.getItem("dhiDashboard") || ""; } catch { return ""; } },
                  set: (t) => { try { t ? sessionStorage.setItem("dhiDashboard", t) : sessionStorage.removeItem("dhiDashboard"); } catch {} } };
  let token = store.get(), daten = null, gespraech = "";

  async function api(pfad, opts = {}) {
    const r = await fetch(pfad, { ...opts, headers: { "X-Dashboard-Token": token } });
    if (r.status === 403) { abmelden("Token ungültig."); throw new Error("403"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function abmelden(msg = "") {
    token = ""; store.set(""); $("app").hidden = true; $("abmelden").hidden = true;
    $("login").hidden = false; $("loginfehler").textContent = msg; $("token").value = "";
  }

  function balken(el, obj) {
    const max = Math.max(1, ...Object.values(obj));
    el.innerHTML = Object.entries(obj).map(([k, n]) =>
      `<span>${esc(k)}</span><span class="n">${n}</span><div class="bar"><i style="width:${(n / max) * 100}%"></i></div>`
    ).join("") || '<span class="n">Noch keine Daten</span>';
  }

  function tageChart(proTag, zeitraum) {
    const tage = [];
    for (let i = zeitraum - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      tage.push(d.toLocaleDateString("sv")); // YYYY-MM-DD in lokaler Zeit
    }
    const max = Math.max(1, ...tage.map((t) => proTag[t] || 0));
    $("tage").innerHTML = tage.map((t) => {
      const n = proTag[t] || 0;
      return `<div style="height:${(n / max) * 100}%" title="${new Date(t).toLocaleDateString("de-DE")}: ${n} Fragen"></div>`;
    }).join("");
    const f = (t) => new Date(t).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    $("achse").innerHTML = `<span>${f(tage[0])}</span><span>heute</span>`;
  }

  function tabelle() {
    const zeilen = daten.anfragen.filter((a) => !gespraech || a.gespraech === gespraech);
    $("filterweg").hidden = !gespraech;
    $("zeilen").innerHTML = zeilen.map((a) => `<tr>
      <td class="zeit">${new Date(a.ts).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}<br>${esc(a.seite)}</td>
      <td><button class="gid" data-g="${esc(a.gespraech)}" title="Nur dieses Gespräch zeigen">${esc(a.gespraech.slice(0, 8))}</button></td>
      <td><span class="tag ${a.art === "fehler" ? "fehler" : ""}">${esc(a.art === "fehler" ? "Fehler" : a.thema)}</span></td>
      <td>${esc(a.frage)}</td>
      <td class="antw"><details><summary>Antwort</summary><p>${esc(a.antwort)}</p></details></td>
      <td><button class="x" data-id="${a.id}" aria-label="Eintrag löschen" title="Eintrag löschen">✕</button></td>
    </tr>`).join("") || '<tr><td colspan="6">Keine Anfragen im Zeitraum.</td></tr>';
    $("hinweis").textContent = `${zeilen.length} von ${daten.gesamt} Einträgen angezeigt. `
      + `Anonymisiert: keine IP-Adressen, Cookies oder Geräte-Kennungen; E-Mail-Adressen, Telefonnummern und IBANs sind geschwärzt. `
      + `Einträge werden nach ${daten.aufbewahrung_tage} Tagen automatisch gelöscht.`;
  }

  async function laden() {
    const zeitraum = +$("zeitraum").value;
    const q = new URLSearchParams({ tage: zeitraum, suche: $("suche").value.trim() });
    daten = await api("/api/dashboard/anfragen?" + q);
    $("login").hidden = true; $("app").hidden = false; $("abmelden").hidden = false;
    $("k-gesamt").textContent = daten.gesamt;
    $("k-gespraeche").textContent = daten.gespraeche;
    $("k-schnitt").textContent = daten.gespraeche ? (daten.gesamt / daten.gespraeche).toFixed(1).replace(".", ",") : "–";
    $("k-fehler").textContent = daten.arten.fehler || 0;
    tageChart(daten.pro_tag, zeitraum);
    balken($("themen"), daten.themen);
    balken($("seiten"), daten.seiten);
    tabelle();
  }

  function csv() {
    const kopf = ["Zeit (UTC)", "Seite", "Gespräch", "Thema", "Art", "Frage", "Antwort"];
    const feld = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    const zeilen = daten.anfragen.map((a) => [a.ts, a.seite, a.gespraech, a.thema, a.art, a.frage, a.antwort].map(feld).join(";"));
    const blob = new Blob(["﻿" + [kopf.map(feld).join(";"), ...zeilen].join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `dhi-bot-anfragen-${new Date().toLocaleDateString("sv")}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  $("loginform").onsubmit = (e) => {
    e.preventDefault(); token = $("token").value.trim(); store.set(token);
    laden().catch((err) => { if (err.message !== "403") $("loginfehler").textContent = "Server nicht erreichbar."; });
  };
  $("abmelden").onclick = () => abmelden();
  $("zeitraum").onchange = () => laden();
  let t; $("suche").oninput = () => { clearTimeout(t); t = setTimeout(laden, 300); };
  $("filterweg").onclick = () => { gespraech = ""; tabelle(); };
  $("csv").onclick = csv;
  $("zeilen").onclick = async (e) => {
    const g = e.target.closest(".gid"), x = e.target.closest(".x");
    if (g) { gespraech = g.dataset.g; tabelle(); }
    if (x && confirm("Diesen Eintrag endgültig löschen?")) {
      await api("/api/dashboard/anfragen/" + x.dataset.id, { method: "DELETE" });
      laden();
    }
  };
  if (token) laden().catch(() => {});
})();
</script>
</body>
</html>
