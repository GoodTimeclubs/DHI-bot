name: CI/CD

# Pipeline für den DHI-Bot
# ────────────────────────────────────────────────────────────────────────────
#   Pull Request      → Tests + Docker-Build (kein Deployment)
#   Push auf main     → Tests + Docker-Build → Deployment auf den VPS
#                       → Smoke-Test der Live-URL → QS-Testkatalog
#   Manuell (Actions) → dasselbe, wahlweise mit anderem Commit (Rollback)
#                       und anderem QS-Umfang
#
# Voraussetzungen (einmalig einrichten): docs/ci-cd.md

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Commit, der ausgerollt werden soll (leer = aktueller main-Stand). Für ein Rollback den alten Commit eintragen."
        required: false
        default: ""
      qs_umfang:
        description: "QS-Testkatalog nach dem Deployment"
        required: false
        default: "voll"
        type: choice
        options: [voll, smoke, aus]

concurrency:
  group: cicd-${{ github.ref }}
  # Laufende Deployments nie abbrechen — nur PR-Läufe dürfen überholt werden.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  BOT_URL: ${{ vars.BOT_URL || 'https://bot.deutsches-hypnoseinstitut.de' }}

jobs:
  # ── 1 · Tests ─────────────────────────────────────────────────────────────
  tests:
    name: Tests (pytest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Chromium für die Widget-Tests
        run: python -m playwright install --with-deps chromium

      - name: Testdaten offline aus fixtures/ bauen
        # tests/test_termine.py liest data/termine.json schon beim Import,
        # tests/test_widget.py braucht zusätzlich data/index.pkl.
        # Beides entsteht hier ohne Netz, ohne API-Key und ohne Kosten.
        run: |
          python -m app.crawler --from-fixtures
          python -c "from app.indexer import build_index; build_index()"

      - name: pytest
        env:
          # Widget-Tests starten einen eigenen Server im Mock-Modus.
          MOCK_LLM: "1"
          CRAWL_ON_START: never
        run: pytest tests -v --junitxml=pytest-report.xml

      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  # ── 2 · Docker-Image ──────────────────────────────────────────────────────
  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Gebaut wird hier nur zur Kontrolle: Das Produktiv-Image entsteht auf
      # dem VPS (docker compose build). Bricht der Build hier, fährt das
      # Deployment gar nicht erst los.
      - name: Build prüfen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3 · Deployment ────────────────────────────────────────────────────────
  deploy:
    name: Deployment auf den VPS
    runs-on: ubuntu-latest
    needs: [tests, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BOT_URL || 'https://bot.deutsches-hypnoseinstitut.de' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ausrollen
        env:
          TARGET_SHA: ${{ github.event.inputs.deploy_sha || github.sha }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/dhi-bot' }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        # Das Skript wird nicht auf dem Server vorgehalten, sondern aus diesem
        # Checkout über stdin hineingereicht — es ist damit immer exakt der
        # Stand, der auch ausgerollt wird.
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_TARGET" "bash -s -- '$TARGET_SHA' '$APP_DIR'" \
              < scripts/deploy_remote.sh

      - name: SSH-Key wieder entfernen
        if: always()
        run: rm -f ~/.ssh/id_deploy

  # ── 4 · Smoke-Test (kostenlos, keine Chat-Anfragen) ───────────────────────
  smoke:
    name: Smoke-Test der Live-URL
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "httpx>=0.27"

      - name: Health, Widget-Auslieferung und CORS prüfen
        run: python scripts/smoke_live.py --base-url "$BOT_URL"

  # ── 5 · QS-Testkatalog gegen die Live-URL ─────────────────────────────────
  # Verbraucht echtes Anthropic-Guthaben (Volllauf ≈ 50 US-Cent) — mit dem
  # Secret QS_TEST_TOKEN aber vom GETRENNTEN Schlüssel des Servers
  # (ANTHROPIC_API_KEY_TEST), nicht vom Produktivguthaben. Ohne das Secret
  # läuft der Katalog über den Produktivschlüssel und zählt gegen das
  # Tageslimit; der Runner warnt dann im Log.
  # Umfang umstellbar ohne YAML-Änderung: Repository-Variable QS_UMFANG
  # auf "smoke" (15 Fälle) oder "aus" setzen.
  qs:
    name: QS-Testkatalog (Live)
    runs-on: ubuntu-latest
    needs: smoke
    if: (github.event.inputs.qs_umfang || vars.QS_UMFANG || 'voll') != 'aus'
    timeout-minutes: 35
    # Nötig, damit das Environment-Secret QS_TEST_TOKEN sichtbar ist.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Terminstand des Bots holen
        # Der Runner prüft Terminantworten gegen data/termine.json. Die
        # Fixtures im Repo sind ein alter Stand, und direkt an die Website
        # kommt der Runner nicht heran (Hostinger nimmt von
        # Rechenzentrums-IPs keine Verbindung an) — also über /api/termine
        # vom Bot selbst, der die Daten nachts ohnehin frisch crawlt.
        run: python scripts/fetch_live_termine.py --base-url "$BOT_URL"

      - name: Katalog durchspielen
        env:
          BASE_URL: ${{ env.BOT_URL }}
          UMFANG: ${{ github.event.inputs.qs_umfang || vars.QS_UMFANG || 'voll' }}
          # Trennt den Testverkehr vom Produktivguthaben und hebt zugleich das
          # IP-Rate-Limit auf — der Katalog läuft damit ohne Pausen durch.
          DHI_TEST_TOKEN: ${{ secrets.QS_TEST_TOKEN }}
        run: bash scripts/qs_live.sh

      - name: QS-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qs-bericht
          path: tests/report/
          if-no-files-found: ignore
